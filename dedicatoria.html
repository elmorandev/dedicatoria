<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti | San Valentín</title>
    <link rel="stylesheet" href="dedicatoria.css">
</head>

<body>

    <!-- PÁGINA 1: PRESENTACIÓN INICIAL -->
    <div class="container page-1" id="page1">
        <div class="heart" id="heartClick">❤️</div>
        <p class="dedication">Para la Zori que más quiero</p>
    </div>

    <!-- PÁGINA 2: TRANSICIÓN CON DIFUMINACIÓN -->
    <div class="container page-2 hidden" id="page2">
        <div class="fade-transition-container">
            <div class="fade-transition"></div>
        </div>
    </div>

    <!-- PÁGINA 3: CARTA + JARDÍN DE GIRASOLES -->
    <div class="container page-3 hidden" id="page3">

        <button class="back-btn-top" id="backBtnTop" style="z-index: 100;">← Volver</button>

        <!-- CARTA CON ANIMACIÓN DE ESCRITURA -->
        <div class="letter-section">
            <div class="card-letter">
                <p class="typing-area" id="typed-text"></p>
                <p class="signature" id="signature"></p>
            </div>
        </div>

        <div class="clouds-container">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="cloud c4"></div>
        </div>

        <div class="garden-footer">
            <div class="grass"></div>

            <div class="sunflower-row">
                <div class="sunflower-wrapper s-1"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-2"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-3"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-1"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-2"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-3"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
                <div class="sunflower-wrapper s-1"><svg class="sunflower-svg">
                        <use href="#sunflower-def" />
                    </svg></div>
            </div>
        </div>

        <svg style="display: none;">
            <symbol id="sunflower-def" viewBox="0 0 100 200">
                <path d="M50 200 Q 55 150 50 80" stroke="#4CAF50" stroke-width="6" fill="none" />
                <path d="M50 140 Q 20 130 10 120 Q 30 140 50 145" fill="#4CAF50" />
                <path d="M50 160 Q 80 150 90 140 Q 70 160 50 165" fill="#4CAF50" />
                <g class="flower-head">
                    <g class="petals">
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFC107" transform="rotate(0 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFC107" transform="rotate(45 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFC107" transform="rotate(90 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFC107" transform="rotate(135 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFD54F" transform="rotate(22.5 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFD54F" transform="rotate(67.5 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFD54F" transform="rotate(112.5 50 80)" />
                        <ellipse cx="50" cy="80" rx="12" ry="30" fill="#FFD54F" transform="rotate(157.5 50 80)" />
                    </g>
                    <circle cx="50" cy="80" r="14" fill="#5D4037" />
                    <circle cx="50" cy="80" r="4" fill="#795548" opacity="0.5" />
                </g>
            </symbol>
        </svg>
    </div>

    <script src="dedicatoria.js"></script>
</body>

</html>
