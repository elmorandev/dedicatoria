<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti | San Valentín</title>
    <link rel="stylesheet" href="dedicatoria.css">
</head>
<body>

    <!-- PÁGINA 1: PRESENTACIÓN INICIAL -->
    <div class="container page-1" id="page1">
        <div class="heart" id="heartClick">❤️</div>
        <p class="dedication">Para la Zori que más quiero</p>
    </div>

    <!-- PÁGINA 2: TRANSICIÓN CON DIFUMINACIÓN -->
    <div class="container page-2 hidden" id="page2">
        <div class="fade-transition-container">
            <div class="fade-transition"></div>
        </div>
    </div>

    <!-- PÁGINA 3: CARTA + JARDÍN DE GIRASOLES -->
    <div class="container page-3 hidden" id="page3">
        <button class="back-btn-top" id="backBtnTop">← Volver</button>
        
        <div class="content-wrapper">
            <!-- LADO IZQUIERDO: CARTA -->
            <div class="letter-section">
                <div class="card-letter">
                    <div id="typed-text" class="typing-area"></div>
                    <div id="signature" class="signature"></div>
                </div>
            </div>

            <!-- LADO DERECHO: JARDÍN DE GIRASOLES MEJORADO -->
            <div class="garden-section">
                <div class="sunflower-garden">
                    
                    <!-- CIELO CON NUBES -->
                    <div class="sky-background">
                        <div class="cloud cloud-1"></div>
                        <div class="cloud cloud-2"></div>
                    </div>
                    
                    <!-- GIRASOL 1 -->
                    <svg class="sunflower-svg s-1" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M50 200 Q 55 150 50 80" stroke="#4CAF50" stroke-width="4" fill="none"/>
                        <path class="leaf" d="M50 140 Q 30 130 20 120 Q 35 140 50 145" fill="#4CAF50"/>
                        <path class="leaf" d="M50 160 Q 70 150 80 140 Q 65 160 50 165" fill="#4CAF50"/>
                        <g class="flower-head">
                            <g class="petals">
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFC107" transform="rotate(0 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFC107" transform="rotate(45 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFC107" transform="rotate(90 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFC107" transform="rotate(135 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFD54F" transform="rotate(22.5 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFD54F" transform="rotate(67.5 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFD54F" transform="rotate(112.5 50 80)"/>
                                <ellipse cx="50" cy="80" rx="10" ry="25" fill="#FFD54F" transform="rotate(157.5 50 80)"/>
                            </g>
                            <circle cx="50" cy="80" r="12" fill="#5D4037"/>
                            <circle cx="50" cy="80" r="9" fill="#795548" opacity="0.5"/>
                        </g>
                    </svg>

                    <!-- GIRASOL 2 -->
                    <svg class="sunflower-svg s-2" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M50 200 Q 45 150 50 70" stroke="#388E3C" stroke-width="5" fill="none"/>
                        <path class="leaf" d="M50 130 Q 20 110 10 100 Q 30 130 50 135" fill="#388E3C"/>
                        <path class="leaf" d="M50 160 Q 80 140 90 130 Q 70 160 50 165" fill="#388E3C"/>
                        <g class="flower-head">
                            <g class="petals">
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(0 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(30 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(60 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(90 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(120 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFC107" transform="rotate(150 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(15 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(45 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(75 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(105 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(135 50 70)"/>
                                <ellipse cx="50" cy="70" rx="12" ry="28" fill="#FFD54F" transform="rotate(165 50 70)"/>
                            </g>
                            <circle cx="50" cy="70" r="14" fill="#3E2723"/>
                            <circle cx="50" cy="70" r="10" fill="#5D4037" opacity="0.5"/>
                        </g>
                    </svg>

                    <!-- GIRASOL 3 (EL MÁS GRANDE) -->
                    <svg class="sunflower-svg s-3" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M50 200 Q 45 140 50 60" stroke="#388E3C" stroke-width="6" fill="none"/>
                        <path class="leaf" d="M50 120 Q 20 100 10 90 Q 30 120 50 125" fill="#388E3C"/>
                        <path class="leaf" d="M50 150 Q 80 130 90 120 Q 70 150 50 155" fill="#388E3C"/>
                        <path class="leaf" d="M50 180 Q 25 165 15 155 Q 35 180 50 185" fill="#2E7D32"/>
                        <g class="flower-head">
                            <g class="petals">
                                <circle cx="50" cy="60" r="38" fill="#FFA000" opacity="0.3"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(0 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(30 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(60 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(90 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(120 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFC107" transform="rotate(150 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(15 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(45 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(75 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(105 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(135 50 60)"/>
                                <ellipse cx="50" cy="60" rx="12" ry="32" fill="#FFD54F" transform="rotate(165 50 60)"/>
                            </g>
                            <circle cx="50" cy="60" r="16" fill="#3E2723"/>
                            <circle cx="50" cy="60" r="12" fill="#5D4037" opacity="0.5"/>
                        </g>
                    </svg>

                    <!-- GIRASOL 4 -->
                    <svg class="sunflower-svg s-4" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M50 200 Q 60 145 55 85" stroke="#4CAF50" stroke-width="4.5" fill="none"/>
                        <path class="leaf" d="M55 145 Q 80 135 85 125 Q 70 145 55 150" fill="#4CAF50"/>
                        <path class="leaf" d="M55 170 Q 30 160 25 150 Q 40 170 55 175" fill="#43A047"/>
                        <g class="flower-head">
                            <g class="petals">
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FFEB3B" transform="rotate(0 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FFEB3B" transform="rotate(45 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FFEB3B" transform="rotate(90 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FFEB3B" transform="rotate(135 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FDD835" transform="rotate(22.5 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FDD835" transform="rotate(67.5 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FDD835" transform="rotate(112.5 55 85)"/>
                                <ellipse cx="55" cy="85" rx="11" ry="26" fill="#FDD835" transform="rotate(157.5 55 85)"/>
                            </g>
                            <circle cx="55" cy="85" r="13" fill="#4E342E"/>
                            <circle cx="55" cy="85" r="9" fill="#6D4C41" opacity="0.5"/>
                        </g>
                    </svg>

                    <!-- GIRASOL 5 -->
                    <svg class="sunflower-svg s-5" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M50 200 Q 48 155 52 88" stroke="#4CAF50" stroke-width="4" fill="none"/>
                        <path class="leaf" d="M52 150 Q 75 140 80 130 Q 65 150 52 155" fill="#4CAF50"/>
                        <g class="flower-head">
                            <g class="petals">
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFC107" transform="rotate(0 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFC107" transform="rotate(40 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFC107" transform="rotate(80 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFC107" transform="rotate(120 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFC107" transform="rotate(160 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFD54F" transform="rotate(20 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFD54F" transform="rotate(60 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFD54F" transform="rotate(100 52 88)"/>
                                <ellipse cx="52" cy="88" rx="10" ry="24" fill="#FFD54F" transform="rotate(140 52 88)"/>
                            </g>
                            <circle cx="52" cy="88" r="11" fill="#5D4037"/>
                            <circle cx="52" cy="88" r="8" fill="#795548" opacity="0.5"/>
                        </g>
                    </svg>

                    <!-- GIRASOL 6 -->
                    <svg class="sunflower-svg s-6" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                        <path class="stem" d="M48 200 Q 52 160 48 92" stroke="#4CAF50" stroke-width="3.5" fill="none"/>
                        <path class="leaf" d="M48 155 Q 70 145 75 135 Q 60 155 48 160" fill="#4CAF50"/>
                        <g class="flower-head">
                            <g class="petals">
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FFEB3B" transform="rotate(0 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FFEB3B" transform="rotate(45 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FFEB3B" transform="rotate(90 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FFEB3B" transform="rotate(135 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FDD835" transform="rotate(22.5 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FDD835" transform="rotate(67.5 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FDD835" transform="rotate(112.5 48 92)"/>
                                <ellipse cx="48" cy="92" rx="9" ry="22" fill="#FDD835" transform="rotate(157.5 48 92)"/>
                            </g>
                            <circle cx="48" cy="92" r="10" fill="#4E342E"/>
                            <circle cx="48" cy="92" r="7" fill="#6D4C41" opacity="0.5"/>
                        </g>
                    </svg>
                    
                    <!-- PARTÍCULAS FLOTANTES -->
                    <div class="particles">
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                    </div>
                    
                    <!-- CÉSPED Y TIERRA -->
                    <div class="grass"></div>
                    <div class="ground"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="dedicatoria.js"></script>
</body>
</html>
